{% extends "base.html" %}

{% block title %}
Edit Student - Student Management System
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Edit Student</h1>

    <p>Update the student details below.</p>

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" value="{{ student[1] }}" required>


        <label>Email:</label>
        <input type="email" name="email" value="{{ student[2] }}" required>


        <label>Course:</label>
        <input type="text" name="course" value="{{ student[3] }}" required>


        <label>Phone:</label>
        <input type="text" name="phone" value="{{ student[4] }}" required>


        <button type="submit" class="add-btn">
            Update Student
        </button>

    </form>

    <br>

    <a href="/">← Back to Student List</a>

</div>

{% endblock %}
